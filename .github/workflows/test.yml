name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes gnupg ripgrep
      - name: check shell syntax
        run: bash -n install.sh install-root.sh lib/agent-secrets-helper bin/* tests/smoke.sh
      - name: run smoke test
        run: ./tests/smoke.sh
