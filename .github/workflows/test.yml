name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: bash syntax
        run: bash -n install.sh install-root.sh lib/agent-secrets-helper bin/* migrations/*.sh tests/*.sh
      - name: shellcheck
        run: |
          shellcheck -x -S warning \
            install.sh install-root.sh lib/agent-secrets-helper \
            bin/secret-* bin/pg-hosts bin/ssh-hosts bin/secrets-bisync \
            migrations/*.sh tests/*.sh

  test:
    # macos-latest is apple silicon and macos-15-intel is x86_64; between them
    # they cover both homebrew prefixes, /opt/homebrew and /usr/local, which is
    # the difference that decides whether hardening is available at all. both
    # also run the helper under the stock /bin/bash 3.2, the only bash on a mac
    # that root owns, so these jobs are what keep this file honest about bash 4
    # syntax.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: install gnupg
        if: runner.os == 'macOS'
        run: brew list gnupg >/dev/null 2>&1 || brew install gnupg
      - name: report the platform
        run: |
          uname -a
          /bin/bash --version | head -1
          gpg --version | head -1
      - name: smoke test
        run: ./tests/smoke.sh
      - name: key generation
        run: ./tests/key.sh
      - name: scope format properties
        run: ./tests/format.sh
      - name: destructive paths and data loss
        run: ./tests/integrity.sh
      - name: upgrade must not touch the store
        run: ./tests/upgrade.sh
